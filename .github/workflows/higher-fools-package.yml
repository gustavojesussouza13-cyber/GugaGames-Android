name: Higher Fools - pacote interno v0.3.1
on:
  push:
    branches: [higher-fools-prototipo]
    paths: ['.github/workflows/higher-fools-package.yml']
permissions:
  contents: read
jobs:
  package-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validar áudio original incorporado
        run: |
          test -s HigherFools/v0.3.1/audio/sinfonia_da_desgraca_preview.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 HigherFools/v0.3.1/audio/sinfonia_da_desgraca_preview.mp3
          grep -q 'loop src="audio/sinfonia_da_desgraca_preview.mp3"' HigherFools/v0.3.1/index.html
          node --check HigherFools/v0.3.1/game.js
          test -s HigherFools/v0.3.1/style.css
      - uses: actions/upload-artifact@v4
        with:
          name: HigherFools-v0.3.1-com-musica
          path: HigherFools/v0.3.1/
          retention-days: 90
