plugins {
    id 'com.android.application'
}
android {
    namespace 'com.higherfools.experimental'
    compileSdk 35

    defaultConfig {
        applicationId 'com.higherfools.experimental'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.1'
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
